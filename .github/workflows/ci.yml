name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
          python -m compileall -q src tests scripts

      - name: Test
        run: pytest

      - name: Fixture demo
        run: |
          python -m smokeroom run \
            --measurements fixtures/noiseless/measurements.csv \
            --config fixtures/noiseless/config.json \
            --output outputs/noiseless
          grep -q "usable fraction: 1" outputs/noiseless/summary.txt

      - name: Upload demo report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: noiseless-demo
          path: |
            outputs/noiseless/result.json
            outputs/noiseless/summary.txt
            outputs/noiseless/report.html
          if-no-files-found: error
