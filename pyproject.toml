[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smokeroom"
version = "0.1.0"
description = "Retrospective one-zone comparison of indoor PM2.5 with a declared filtration model."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[project.scripts]
smokeroom = "smokeroom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
